server:
  port: 8080

spring:
  application:
    name: team-jeopardy
  datasource:
    url: jdbc:sqlite:${team-jeopardy.persistence.path:./data/team-jeopardy.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
      continue-on-error: false

team-jeopardy:
  sample-code-path: ../samples/sample-reactor
  sample-gradle-path: ../samples/sample-gradle
  sample-vue-path: ../samples/sample-vue
  sample-python-path: ../samples/sample-python
  allowed-origins: "*"
  max-teams: 6
  max-players-per-team: 8
  buzz-lock-ms: 8000
  persistence:
    # SQLite file for guide-generated boards/clues (reuse across sessions)
    enabled: true
    path: ${TEAM_JEOPARDY_DB:./data/team-jeopardy.db}
  questions:
    # Mix engineer + QA lenses on the same graph (coder, qa, or both)
    personas: coder,qa
    max-categories: 6
  openai:
    # Heuristic clues always work offline. Enable to polish prompts with Chat Completions.
    enabled: false
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1
    max-clues: 24
    timeout-seconds: 20
  github:
    # Recent PR boards: set GITHUB_TOKEN (or GH_TOKEN) for private repos / higher rate limits.
    token: ${GITHUB_TOKEN:}
    api-base: https://api.github.com
    # Public by default; private repos work when GITHUB_TOKEN can read them.
    default-repo: jmjava/team-jeopardy
    pr-limit: 8
    timeout-seconds: 45
    workspace: ${java.io.tmpdir}/team-jeopardy-github
  jira:
    # Read-only search. Never commit real hosts or tokens. Public samples use jira.example.
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    timeout-seconds: 30
    max-issues: 200
    fixture-multi-path: ../samples/jira-release-multi-project.json
    fixture-one-project-path: ../samples/jira-release-one-project.json
    acceptance-field: ${JIRA_ACCEPTANCE_FIELD:}
    epic-name-field: ${JIRA_EPIC_NAME_FIELD:}

logging:
  level:
    com.jmjava.teamjeopardy: INFO
