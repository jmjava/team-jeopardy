<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" fill="none">
  <title>Team Jeopardy  White-Label Guide (logo + color scheme)</title>

  <rect width="1600" height="1400" fill="#071225"/>
  <text x="60" y="52" fill="#f4f7ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">White-Label Guide</text>
  <text x="60" y="84" fill="#a9b7d4" font-family="Arial, Helvetica, sans-serif" font-size="14">Logo placement + color scheme overrides · maps to client/src/styles.css and header components</text>

  <!-- Section 1: Default vs Custom -->
  <g id="default-vs-custom" transform="translate(60, 110)">
    <text x="0" y="0" fill="#f0d060" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">DEFAULT VS CUSTOM BRAND</text>

    <!-- Default -->
    <g id="brand-default" transform="translate(0, 20)">
      <text x="0" y="0" fill="#a9b7d4" font-size="12" font-weight="700">DEFAULT (today)</text>
      <rect y="8" width="700" height="200" rx="16" fill="#0c1c3a" stroke="#a9b7d4" stroke-opacity="0.25"/>
      <!-- Navy/gold theme preview -->
      <rect x="20" y="28" width="660" height="160" rx="12" fill="#071225"/>
      <rect x="20" y="28" width="660" height="160" rx="12" fill="url(#defaultGrad)" opacity="0.5"/>
      <text x="36" y="58" fill="#f0d060" font-size="10" letter-spacing="2">MODERATOR · LOBBY</text>
      <text x="36" y="98" fill="#f4f7ff" font-size="32" font-weight="700">Team Jeopardy</text>
      <rect x="36" y="118" width="120" height="32" rx="8" fill="#f0d060"/>
      <text x="52" y="139" fill="#1a1400" font-size="12" font-weight="700">Create room</text>
      <rect x="500" y="60" width="160" height="100" rx="8" fill="#0b3d91"/>
      <rect x="516" y="80" width="48" height="32" rx="4" fill="#1152c0"/>
      <rect x="572" y="80" width="48" height="32" rx="4" fill="#1152c0"/>
      <rect x="628" y="80" width="16" height="32" rx="4" fill="#1152c0"/>
      <text x="520" y="148" fill="#a9b7d4" font-size="10">Board cells</text>
      <!-- swatches -->
      <rect x="36" y="160" width="24" height="24" rx="4" fill="#f0d060"/><text x="68" y="177" fill="#a9b7d4" font-size="10">--gold</text>
      <rect x="140" y="160" width="24" height="24" rx="4" fill="#0b3d91"/><text x="172" y="177" fill="#a9b7d4" font-size="10">--board</text>
      <rect x="244" y="160" width="24" height="24" rx="4" fill="#071225" stroke="#a9b7d4" stroke-opacity="0.3"/><text x="276" y="177" fill="#a9b7d4" font-size="10">bg #071225</text>
    </g>

    <!-- Custom example -->
    <g id="brand-custom" transform="translate(780, 20)">
      <text x="0" y="0" fill="#a9b7d4" font-size="12" font-weight="700">CUSTOM (white-label example)</text>
      <rect y="8" width="700" height="200" rx="16" fill="#0c1c3a" stroke="#22c55e" stroke-opacity="0.5"/>
      <rect x="20" y="28" width="660" height="160" rx="12" fill="#0a1628"/>
      <rect x="20" y="28" width="660" height="160" rx="12" fill="url(#customGrad)" opacity="0.6"/>
      <!-- Logo slot -->
      <rect x="36" y="52" width="48" height="48" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="44" y="82" fill="#38bdf8" font-size="9" font-weight="700">ACME</text>
      <text x="96" y="82" fill="#f8fafc" font-size="28" font-weight="700">Code Quiz Night</text>
      <rect x="36" y="118" width="120" height="32" rx="8" fill="#38bdf8"/>
      <text x="52" y="139" fill="#0a1628" font-size="12" font-weight="700">Create room</text>
      <rect x="500" y="60" width="160" height="100" rx="8" fill="#1e3a5f"/>
      <rect x="516" y="80" width="48" height="32" rx="4" fill="#2563eb"/>
      <rect x="572" y="80" width="48" height="32" rx="4" fill="#2563eb"/>
      <rect x="628" y="80" width="16" height="32" rx="4" fill="#2563eb"/>
      <text x="520" y="148" fill="#a9b7d4" font-size="10">Board cells</text>
      <rect x="36" y="160" width="24" height="24" rx="4" fill="#38bdf8"/><text x="68" y="177" fill="#a9b7d4" font-size="10">accent</text>
      <rect x="140" y="160" width="24" height="24" rx="4" fill="#1e3a5f"/><text x="172" y="177" fill="#a9b7d4" font-size="10">--board</text>
      <rect x="244" y="160" width="24" height="24" rx="4" fill="#0a1628" stroke="#a9b7d4" stroke-opacity="0.3"/><text x="276" y="177" fill="#a9b7d4" font-size="10">bg custom</text>
    </g>
  </g>

  <!-- Section 2: Logo placement map -->
  <g id="logo-placements" transform="translate(60, 360)">
    <text x="0" y="0" fill="#f0d060" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOGO PLACEMENT MAP</text>
    <text x="0" y="22" fill="#a9b7d4" font-family="Arial, Helvetica, sans-serif" font-size="12">Replace text-only brand with logo + optional app name</text>

    <g transform="translate(0, 40)">
      <!-- Slot 1 -->
      <rect width="360" height="120" rx="12" fill="#0f1b33" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="16" y="36" width="56" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="28" y="70" fill="#38bdf8" font-size="10">LOGO</text>
      <text x="84" y="58" fill="#f4f7ff" font-size="14" font-weight="700">App.vue header</text>
      <text x="84" y="78" fill="#a9b7d4" font-size="11">Main app + admin shell</text>
      <text x="84" y="96" fill="#a9b7d4" font-size="10">client/src/App.vue · .top header</text>

      <!-- Slot 2 -->
      <g transform="translate(380, 0)">
        <rect width="360" height="120" rx="12" fill="#0f1b33" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
        <rect x="16" y="36" width="56" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
        <text x="28" y="70" fill="#38bdf8" font-size="10">LOGO</text>
        <text x="84" y="58" fill="#f4f7ff" font-size="14" font-weight="700">SharedDisplay.vue</text>
        <text x="84" y="78" fill="#a9b7d4" font-size="11">Projector / TV view</text>
        <text x="84" y="96" fill="#a9b7d4" font-size="10">?view=display header</text>
      </g>

      <!-- Slot 3 -->
      <g transform="translate(760, 0)">
        <rect width="360" height="120" rx="12" fill="#0f1b33" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
        <rect x="16" y="36" width="56" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
        <text x="28" y="70" fill="#38bdf8" font-size="10">LOGO</text>
        <text x="84" y="58" fill="#f4f7ff" font-size="14" font-weight="700">LobbyView.vue</text>
        <text x="84" y="78" fill="#a9b7d4" font-size="11">Hero area (optional)</text>
        <text x="84" y="96" fill="#a9b7d4" font-size="10">First screen visitors see</text>
      </g>

      <!-- Slot 4 -->
      <g transform="translate(1140, 0)">
        <rect width="340" height="120" rx="12" fill="#0f1b33" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
        <rect x="16" y="44" width="40" height="40" rx="6" fill="#1e293b"/>
        <text x="68" y="58" fill="#f4f7ff" font-size="14" font-weight="700">index.html</text>
        <text x="68" y="78" fill="#a9b7d4" font-size="11">Favicon + page title</text>
        <text x="68" y="96" fill="#a9b7d4" font-size="10">&lt;link rel="icon"&gt; · &lt;title&gt;</text>
      </g>
    </g>
  </g>

  <!-- Section 3: Color scheme map -->
  <g id="color-scheme-map" transform="translate(60, 540)">
    <text x="0" y="0" fill="#f0d060" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">COLOR SCHEME  WHAT EACH TOKEN CONTROLS</text>

    <g transform="translate(0, 24)">
      <!-- Token table -->
      <rect width="720" height="340" rx="12" fill="#0c1c3a" stroke="#a9b7d4" stroke-opacity="0.2"/>
      <text x="20" y="32" fill="#f4f7ff" font-size="13" font-weight="700">CSS variable ’ UI elements</text>

      <!-- rows -->
      <g transform="translate(20, 48)">
        <rect width="24" height="24" rx="4" fill="#f0d060"/><text x="36" y="18" fill="#f4f7ff" font-size="12" font-weight="700">--gold / --gold-deep</text>
        <text x="36" y="36" fill="#a9b7d4" font-size="11">Primary buttons · eyebrows · room codes · clue $ values · accents</text>
        <line x1="0" y1="48" x2="680" y2="48" stroke="#a9b7d4" stroke-opacity="0.15"/>

        <g transform="translate(0, 56)">
          <rect width="24" height="24" rx="4" fill="#0b3d91"/><text x="36" y="18" fill="#f4f7ff" font-size="12" font-weight="700">--board / --board-cell</text>
          <text x="36" y="36" fill="#a9b7d4" font-size="11">Jeopardy grid · category headers · clue stage background</text>
        </g>
        <line x1="0" y1="104" x2="680" y2="104" stroke="#a9b7d4" stroke-opacity="0.15"/>

        <g transform="translate(0, 112)">
          <rect width="24" height="24" rx="4" fill="#071225" stroke="#a9b7d4" stroke-opacity="0.3"/><text x="36" y="18" fill="#f4f7ff" font-size="12" font-weight="700">background / --ink / --panel</text>
          <text x="36" y="36" fill="#a9b7d4" font-size="11">Page gradient · card panels · meta boxes · form backgrounds</text>
        </g>
        <line x1="0" y1="160" x2="680" y2="160" stroke="#a9b7d4" stroke-opacity="0.15"/>

        <g transform="translate(0, 168)">
          <rect width="24" height="24" rx="4" fill="#f4f7ff"/><text x="36" y="18" fill="#f4f7ff" font-size="12" font-weight="700">--text / --muted</text>
          <text x="36" y="36" fill="#a9b7d4" font-size="11">Body copy · labels · placeholder text · secondary buttons border</text>
        </g>
        <line x1="0" y1="216" x2="680" y2="216" stroke="#a9b7d4" stroke-opacity="0.15"/>

        <g transform="translate(0, 224)">
          <rect width="24" height="24" rx="4" fill="#3ecf8e"/><text x="36" y="18" fill="#f4f7ff" font-size="12" font-weight="700">--ok / --danger</text>
          <text x="36" y="36" fill="#a9b7d4" font-size="11">Correct/wrong judge buttons · sync status · error banners</text>
        </g>
        <line x1="0" y1="272" x2="680" y2="272" stroke="#a9b7d4" stroke-opacity="0.15"/>

        <g transform="translate(0, 280)">
          <text x="0" y="16" fill="#f0d060" font-size="11" font-weight="700">Hardcoded hex still in BoardView.vue, ModeratorConsole.vue  tie to vars when implementing</text>
        </g>
      </g>
    </g>

    <!-- Visual color picker mock -->
    <g transform="translate(760, 24)">
      <rect width="720" height="340" rx="12" fill="#0c1c3a" stroke="#22c55e" stroke-opacity="0.35"/>
      <text x="20" y="32" fill="#f4f7ff" font-size="13" font-weight="700">Suggested white-label config panel (future UI)</text>
      <text x="20" y="52" fill="#a9b7d4" font-size="11">Or set via env / application.yml at deploy time</text>

      <rect x="20" y="72" width="680" height="56" rx="10" fill="#0f1b33"/>
      <text x="36" y="96" fill="#a9b7d4" font-size="11">App name</text>
      <rect x="36" y="104" width="300" height="16" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <text x="44" y="116" fill="#f4f7ff" font-size="11">Code Quiz Night</text>

      <rect x="20" y="140" width="680" height="56" rx="10" fill="#0f1b33"/>
      <text x="36" y="164" fill="#a9b7d4" font-size="11">Logo URL</text>
      <rect x="36" y="172" width="400" height="16" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <text x="44" y="184" fill="#38bdf8" font-size="11">/assets/acme-logo.svg</text>

      <text x="20" y="224" fill="#a9b7d4" font-size="11">Accent color (--gold)</text>
      <rect x="20" y="232" width="48" height="32" rx="6" fill="#38bdf8" stroke="#f4f7ff" stroke-width="2"/>
      <text x="80" y="252" fill="#f4f7ff" font-size="11">#38bdf8</text>

      <text x="220" y="224" fill="#a9b7d4" font-size="11">Board color (--board)</text>
      <rect x="220" y="232" width="48" height="32" rx="6" fill="#1e3a5f"/>
      <text x="280" y="252" fill="#f4f7ff" font-size="11">#1e3a5f</text>

      <text x="420" y="224" fill="#a9b7d4" font-size="11">Background</text>
      <rect x="420" y="232" width="48" height="32" rx="6" fill="#0a1628"/>
      <text x="480" y="252" fill="#f4f7ff" font-size="11">#0a1628</text>

      <rect x="20" y="284" width="120" height="36" rx="8" fill="#22c55e"/>
      <text x="38" y="307" fill="#042416" font-size="12" font-weight="700">Apply theme</text>
      <text x="160" y="307" fill="#a9b7d4" font-size="11">’ sets document.documentElement CSS vars at boot</text>
    </g>
  </g>

  <!-- Section 4: Config flow -->
  <g id="config-flow" transform="translate(60, 920)">
    <text x="0" y="0" fill="#f0d060" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CONFIGURATION OPTIONS</text>

    <g transform="translate(0, 24)">
      <!-- Option A -->
      <rect width="480" height="200" rx="12" fill="#0f1b33" stroke="#f0d060" stroke-opacity="0.3"/>
      <text x="20" y="32" fill="#f0d060" font-size="12" font-weight="700">A · Build-time (Vite env)</text>
      <text x="20" y="56" fill="#a9b7d4" font-size="11" font-family="monospace">VITE_APP_NAME=Code Quiz Night</text>
      <text x="20" y="76" fill="#a9b7d4" font-size="11" font-family="monospace">VITE_LOGO_URL=/logo.svg</text>
      <text x="20" y="96" fill="#a9b7d4" font-size="11" font-family="monospace">VITE_ACCENT_COLOR=#38bdf8</text>
      <text x="20" y="116" fill="#a9b7d4" font-size="11" font-family="monospace">VITE_BOARD_COLOR=#1e3a5f</text>
      <text x="20" y="148" fill="#f4f7ff" font-size="11">client/src/theme.js reads vars ’ applyTheme()</text>
      <text x="20" y="168" fill="#a9b7d4" font-size="10">Pros: simple · Cons: rebuild to change</text>

      <!-- Option B -->
      <g transform="translate(500, 0)">
        <rect width="480" height="200" rx="12" fill="#0f1b33" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="20" y="32" fill="#38bdf8" font-size="12" font-weight="700">B · Deploy-time (Spring Boot)</text>
        <text x="20" y="56" fill="#a9b7d4" font-size="11" font-family="monospace">team-jeopardy.branding.app-name</text>
        <text x="20" y="76" fill="#a9b7d4" font-size="11" font-family="monospace">team-jeopardy.branding.logo-url</text>
        <text x="20" y="96" fill="#a9b7d4" font-size="11" font-family="monospace">team-jeopardy.branding.accent-color</text>
        <text x="20" y="116" fill="#a9b7d4" font-size="11" font-family="monospace">TEAM_JEOPARDY_BRAND_* env overrides</text>
        <text x="20" y="148" fill="#f4f7ff" font-size="11">GET /api/branding ’ client applies at boot</text>
        <text x="20" y="168" fill="#a9b7d4" font-size="10">Pros: no rebuild · Cons: server config needed</text>
      </g>

      <!-- Option C -->
      <g transform="translate(1000, 0)">
        <rect width="480" height="200" rx="12" fill="#0f1b33" stroke="#c084fc" stroke-opacity="0.4"/>
        <text x="20" y="32" fill="#c084fc" font-size="12" font-weight="700">C · Admin UI (future)</text>
        <text x="20" y="56" fill="#a9b7d4" font-size="11">Branding section in QuestionBankAdmin</text>
        <text x="20" y="76" fill="#a9b7d4" font-size="11">or dedicated ?view=settings panel</text>
        <text x="20" y="96" fill="#a9b7d4" font-size="11">Upload logo · pick colors · preview live</text>
        <text x="20" y="116" fill="#a9b7d4" font-size="11">Persist to SQLite or config file</text>
        <text x="20" y="148" fill="#f4f7ff" font-size="11">Best for non-technical org admins</text>
        <text x="20" y="168" fill="#a9b7d4" font-size="10">Pros: self-service · Cons: most work to build</text>
      </g>
    </g>
  </g>

  <!-- Section 5: Implementation checklist -->
  <g id="checklist" transform="translate(60, 1160)">
    <text x="0" y="0" fill="#f0d060" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">IMPLEMENTATION CHECKLIST</text>
    <rect y="16" width="1480" height="180" rx="12" fill="#0c1c3a" stroke="#a9b7d4" stroke-opacity="0.2"/>

    <g transform="translate(24, 44)">
      <text x="0" y="0" fill="#22c55e" font-size="14"></text><text x="24" y="0" fill="#f4f7ff" font-size="12">Add theme.js + BrandHeader.vue component (logo img + app name fallback)</text>
      <text x="0" y="28" fill="#22c55e" font-size="14"></text><text x="24" y="28" fill="#f4f7ff" font-size="12">Extend styles.css :root with --bg, --accent aliases; use vars in body gradient</text>
      <text x="0" y="56" fill="#22c55e" font-size="14"></text><text x="24" y="56" fill="#f4f7ff" font-size="12">Replace hardcoded "Team Jeopardy" in App.vue, LobbyView, SharedDisplay, index.html</text>
      <text x="0" y="84" fill="#22c55e" font-size="14"></text><text x="24" y="84" fill="#f4f7ff" font-size="12">Refactor BoardView / ModeratorConsole hardcoded hex ’ CSS variables</text>
      <text x="0" y="112" fill="#22c55e" font-size="14"></text><text x="24" y="112" fill="#f4f7ff" font-size="12">Add /api/branding endpoint + application.yml keys (or Vite env for v1)</text>
      <text x="0" y="140" fill="#22c55e" font-size="14"></text><text x="24" y="140" fill="#f4f7ff" font-size="12">Place logo SVG/PNG in client/public/ · set favicon dynamically or at build</text>
    </g>

    <g transform="translate(780, 44)">
      <text x="0" y="0" fill="#f0d060" font-size="12" font-weight="700">Figma exercises for this guide</text>
      <text x="0" y="24" fill="#a9b7d4" font-size="11">1. Duplicate "custom brand" frame ’ try 3 color palettes</text>
      <text x="0" y="44" fill="#a9b7d4" font-size="11">2. Design a logo component with auto-layout (max 48×48 header)</text>
      <text x="0" y="64" fill="#a9b7d4" font-size="11">3. Build a "Branding settings" panel mock from config section</text>
      <text x="0" y="84" fill="#a9b7d4" font-size="11">4. Create component variants: Default / Acme / Startup themes</text>
      <text x="0" y="104" fill="#a9b7d4" font-size="11">5. Export color styles as a shared library for dev handoff</text>
    </g>
  </g>

  <defs>
    <linearGradient id="defaultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D8BFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0d060" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="customGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
</svg>
